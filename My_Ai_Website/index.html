<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra — AI Workspace</title>

<style>
:root {
    --bg: #0a0b10;
    --panel: #11131b;
    --panel2: #171a24;
    --border: rgba(255,255,255,.08);
    --text: #f5f7fb;
    --muted: #8b93a7;
    --accent: #8b5cf6;
    --accent2: #6366f1;
    --user: #252a3a;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh;
    overflow: hidden;
}

button { font-family: inherit; }
button:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 2px solid rgba(139,92,246,.65);
    outline-offset: 2px;
}

#particles {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}

.app {
    display: flex;
    height: 100vh;
    position: relative;
    z-index: 1;
}

/* Sidebar */

.sidebar {
    width: 260px;
    background: #0d0f15;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 18px;
    flex-shrink: 0;
    transition: transform .25s ease;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 22px;
}

.logo {
    width: 34px;
    height: 34px;
    border-radius: 11px;
    background: linear-gradient(135deg, #a78bfa, #6366f1);
    display: grid;
    place-items: center;
    font-weight: 800;
    color: white;
    box-shadow: 0 0 24px rgba(139,92,246,.25);
    flex-shrink: 0;
}

.brand strong {
    font-size: 17px;
    letter-spacing: -.4px;
}

.brand span {
    display: block;
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
}

.sidebar-close {
    display: none;
    margin-left: auto;
    background: transparent;
    border: 0;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
}

.new-chat {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(139,92,246,.4);
    background: rgba(139,92,246,.14);
    color: #ddd6fe;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
    box-shadow: 0 0 0 rgba(139,92,246,.0);
    transition: box-shadow .25s, background .2s;
}

.new-chat:hover {
    background: rgba(139,92,246,.22);
    box-shadow: 0 0 22px rgba(139,92,246,.28);
}

.sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    margin: 0 -6px;
    padding: 0 6px;
}

.sidebar-scroll::-webkit-scrollbar { width: 6px; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: #1e2230; border-radius: 6px; }

.section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: #596174;
    margin: 24px 4px 10px;
}

.history {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.history-item {
    position: relative;
    display: flex;
    align-items: center;
    border-radius: 8px;
}

.history-item:hover, .history-item.active {
    background: rgba(255,255,255,.05);
}

.history-item button.hist-btn {
    background: transparent;
    border: 0;
    color: #a7aec0;
    padding: 9px 10px;
    text-align: left;
    cursor: pointer;
    font-size: 12px;
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.history-item.active button.hist-btn { color: white; }

.hist-title {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.hist-time {
    font-size: 10px;
    color: #565f74;
}

.hist-delete {
    background: transparent;
    border: 0;
    color: #4d5568;
    cursor: pointer;
    font-size: 13px;
    padding: 6px 9px;
    opacity: 0;
    transition: opacity .15s, color .15s;
}

.history-item:hover .hist-delete { opacity: 1; }
.hist-delete:hover { color: #f87171; }

.empty-note {
    font-size: 11px;
    color: #4d5568;
    padding: 6px 10px;
    line-height: 1.5;
}

.saved-prompt {
    background: transparent;
    border: 0;
    color: #a7aec0;
    padding: 9px 10px;
    border-radius: 8px;
    text-align: left;
    cursor: pointer;
    font-size: 12px;
    width: 100%;
    line-height: 1.4;
}

.saved-prompt:hover { background: rgba(255,255,255,.05); color: white; }

.sidebar-bottom {
    margin-top: 14px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
    flex-shrink: 0;
}

.profile {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #334155, #64748b);
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
}

.profile small {
    color: var(--muted);
    font-size: 11px;
}

/* Main */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background:
        radial-gradient(circle at 50% -20%, rgba(99,102,241,.08), transparent 40%),
        var(--bg);
}

.topbar {
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,11,16,.8);
    flex-shrink: 0;
}

.topbar-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.menu-toggle {
    display: none;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    width: 34px;
    height: 34px;
    cursor: pointer;
    font-size: 15px;
}

.model-select-wrap { position: relative; }

.model {
    display: flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    border: 0;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 10px;
    color: var(--text);
}

.model:hover { background: rgba(255,255,255,.04); }

.model-icon {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: rgba(139,92,246,.15);
    display: grid;
    place-items: center;
    color: #c4b5fd;
    font-size: 15px;
    flex-shrink: 0;
}

.model-text { text-align: left; }

.model strong {
    display: block;
    font-size: 13px;
    font-weight: 600;
}

.model small {
    color: var(--muted);
    font-size: 10px;
}

.model-caret { color: var(--muted); font-size: 9px; margin-left: 2px; }

.model-menu {
    position: absolute;
    top: 44px;
    left: 0;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    width: 210px;
    box-shadow: 0 18px 45px rgba(0,0,0,.4);
    display: none;
    z-index: 20;
}

.model-menu.open { display: block; }

.model-option {
    width: 100%;
    background: transparent;
    border: 0;
    color: #c7cede;
    text-align: left;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    justify-content: space-between;
}

.model-option:hover { background: rgba(139,92,246,.12); color: white; }
.model-option.selected { color: #c4b5fd; }

.status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: #8fa3b8;
}

.dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 8px #34d399;
}

.dot.thinking { background: #a78bfa; box-shadow: 0 0 8px #a78bfa; animation: pulse-dot 1s infinite; }

@keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: .3; }
}

/* Chat */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 42px 20px 30px;
}

.chat-inner {
    max-width: 780px;
    margin: auto;
}

.welcome {
    text-align: center;
    padding: 55px 0 35px;
}

.welcome-orb {
    width: 58px;
    height: 58px;
    border-radius: 18px;
    margin: 0 auto 22px;
    background: linear-gradient(135deg, #8b5cf6, #4f46e5);
    display: grid;
    place-items: center;
    font-size: 25px;
    box-shadow: 0 0 45px rgba(99,102,241,.22);
}

.welcome h1 {
    font-size: clamp(24px, 4vw, 34px);
    letter-spacing: -1.2px;
    margin: 0 0 10px;
    font-weight: 700;
}

.welcome p {
    color: var(--muted);
    font-size: 13px;
    margin: 0;
}

.suggestions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    max-width: 620px;
    margin: 30px auto 0;
}

.suggestion {
    padding: 15px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.025);
    border-radius: 12px;
    color: #b9c0d1;
    text-align: left;
    cursor: pointer;
    font-size: 12px;
    line-height: 1.5;
    transition: .2s;
}

.suggestion:hover {
    border-color: rgba(139,92,246,.45);
    background: rgba(139,92,246,.07);
    color: white;
    transform: translateY(-1px);
}

.suggestion b {
    display: block;
    color: #e2e8f0;
    margin-bottom: 5px;
    font-size: 13px;
}

/* Messages */

.message {
    display: flex;
    gap: 14px;
    margin: 25px 0;
    animation: fade .25s ease;
}

@keyframes fade {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}

.message-avatar {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 700;
}

.user-avatar {
    background: #293044;
    color: #cbd5e1;
}

.ai-avatar {
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: white;
    position: relative;
}

.ai-avatar.pulsing::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 12px;
    border: 2px solid rgba(139,92,246,.5);
    animation: orb-pulse 1.4s ease-out infinite;
}

@keyframes orb-pulse {
    0% { transform: scale(.85); opacity: .8; }
    100% { transform: scale(1.4); opacity: 0; }
}

.message-body {
    flex: 1;
    min-width: 0;
}

.message-name {
    font-size: 11px;
    color: #a7aec0;
    margin-bottom: 7px;
    font-weight: 600;
}

.message-text {
    font-size: 14px;
    line-height: 1.7;
    color: #e4e7ef;
    overflow-wrap: anywhere;
}

.message-text p { margin: 0 0 10px; }
.message-text p:last-child { margin-bottom: 0; }
.message-text ul, .message-text ol { margin: 6px 0 10px; padding-left: 20px; }
.message-text li { margin: 3px 0; }
.message-text h1, .message-text h2, .message-text h3 {
    font-size: 15px;
    margin: 14px 0 8px;
    color: #f2f4f9;
}
.message-text code {
    background: #1c2030;
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 12.5px;
    font-family: "SF Mono", Consolas, monospace;
}
.message-text pre {
    background: #14161f;
    border: 1px solid var(--border);
    padding: 12px 14px;
    border-radius: 10px;
    overflow-x: auto;
    margin: 8px 0;
}
.message-text pre code { background: transparent; padding: 0; }

.message.user .message-text {
    background: var(--user);
    border: 1px solid rgba(255,255,255,.04);
    padding: 12px 15px;
    border-radius: 4px 13px 13px 13px;
    display: inline-block;
}

.msg-attachments {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
}

.msg-attachment {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 11px;
    color: #b9c0d1;
}

.msg-attachment img {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    object-fit: cover;
}

.message-actions {
    margin-top: 10px;
    display: flex;
    gap: 12px;
}

.message-actions button {
    background: transparent;
    border: 0;
    color: #5f687c;
    cursor: pointer;
    font-size: 11px;
}

.message-actions button:hover { color: #b8c0d0; }

/* Composer */

.composer-wrap {
    padding: 0 20px 24px;
    flex-shrink: 0;
}

.composer {
    max-width: 780px;
    margin: auto;
    border: 1px solid rgba(255,255,255,.1);
    background: #151821;
    border-radius: 16px;
    padding: 10px 12px 10px 17px;
    box-shadow: 0 12px 45px rgba(0,0,0,.2);
    transition: border .2s;
}

.composer:focus-within {
    border-color: rgba(139,92,246,.55);
}

.attachments-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 9px;
}

.attachment-chip {
    display: flex;
    align-items: center;
    gap: 7px;
    background: #1c2030;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 5px 6px 5px 5px;
    font-size: 11.5px;
    color: #c7cede;
    max-width: 180px;
}

.attachment-chip img {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
}

.attachment-chip .file-icon {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: rgba(139,92,246,.18);
    color: #c4b5fd;
    display: grid;
    place-items: center;
    font-size: 12px;
    flex-shrink: 0;
}

.attachment-chip .chip-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
}

.attachment-chip .chip-remove {
    background: transparent;
    border: 0;
    color: #666f85;
    cursor: pointer;
    font-size: 13px;
    flex-shrink: 0;
    padding: 2px 3px;
}

.attachment-chip .chip-remove:hover { color: #f87171; }

.attachment-chip .chip-progress {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    flex-shrink: 0;
    background: conic-gradient(#8b5cf6 var(--p, 0%), #2a2f40 0);
    display: grid;
    place-items: center;
}

.input-row {
    display: flex;
    align-items: flex-end;
    gap: 12px;
}

textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    border: 0;
    outline: 0;
    background: transparent;
    color: #eef2ff;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    padding: 7px 0;
    min-height: 36px;
    max-height: 130px;
}

textarea::placeholder { color: #60697d; }

.send {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 11px;
    background: #8b5cf6;
    color: white;
    cursor: pointer;
    display: grid;
    place-items: center;
    font-size: 17px;
    transition: .2s;
    flex-shrink: 0;
}

.send:hover { background: #7c3aed; transform: translateY(-1px); }
.send:disabled { opacity: .35; cursor: not-allowed; transform: none; }

.composer-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 7px;
    font-size: 10px;
    color: #50596d;
}

.composer-tools {
    display: flex;
    gap: 4px;
    align-items: center;
}

.composer-tools button {
    background: transparent;
    border: 0;
    color: #687186;
    cursor: pointer;
    font-size: 11px;
    padding: 5px 7px;
    border-radius: 6px;
}

.composer-tools button:hover { color: #c4b5fd; background: rgba(139,92,246,.1); }
.composer-tools button.on { color: #c4b5fd; background: rgba(139,92,246,.14); }

.footer-hint { white-space: nowrap; }

/* FAB */

.fab {
    display: none;
    position: fixed;
    bottom: 96px;
    right: 20px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: white;
    border: 0;
    font-size: 22px;
    box-shadow: 0 10px 30px rgba(99,102,241,.4);
    cursor: pointer;
    z-index: 15;
}

/* Sidebar overlay for mobile */
.sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 9;
}

/* Mobile */

@media (max-width: 768px) {
    .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 10;
        transform: translateX(-100%);
        box-shadow: 20px 0 50px rgba(0,0,0,.5);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay.show { display: block; }
    .sidebar-close { display: block; }
    .menu-toggle { display: grid; place-items: center; }
    .topbar { padding: 0 14px; }
    .chat { padding: 20px 14px; }
    .welcome { padding: 40px 0 25px; }
    .suggestions { grid-template-columns: 1fr; }
    .composer-wrap { padding: 0 12px 14px; }
    .status { display: none; }
    .fab { display: grid; place-items: center; }
    .model-text small { display: none; }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="app">

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="logo">✦</div>
            <div>
                <strong>Astra</strong>
                <span>AI WORKSPACE</span>
            </div>
            <button class="sidebar-close" aria-label="Close sidebar" onclick="closeSidebar()">✕</button>
        </div>

        <button class="new-chat" onclick="newChat()">＋ &nbsp; New conversation</button>

        <div class="sidebar-scroll">
            <div class="section-label">History</div>
            <div class="history" id="historyList"></div>

            <div class="section-label">Recent projects</div>
            <div class="history">
                <button class="saved-prompt" onclick="useSuggestion('Give me a status update template for my current project.')">◧ &nbsp; Website relaunch</button>
                <button class="saved-prompt" onclick="useSuggestion('Help me outline next steps for the Q4 report.')">◧ &nbsp; Q4 report</button>
            </div>

            <div class="section-label">Saved prompts</div>
            <div class="history">
                <button class="saved-prompt" onclick="useSuggestion('Summarize this in three bullet points: ')">“ &nbsp; Summarize in 3 bullets</button>
                <button class="saved-prompt" onclick="useSuggestion('Rewrite this so it sounds more confident: ')">“ &nbsp; Sound more confident</button>
            </div>
        </div>

        <div class="sidebar-bottom">
            <div class="profile">
                <div class="avatar">K</div>
                <div>
                    <strong style="font-size:12px;">Personal workspace</strong>
                    <small>Private AI assistant</small>
                </div>
            </div>
        </div>
    </aside>

    <main class="main">

        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" aria-label="Open sidebar" onclick="openSidebar()">☰</button>
                <div class="model-select-wrap">
                    <button class="model" id="modelBtn" aria-haspopup="true" aria-expanded="false" onclick="toggleModelMenu()">
                        <div class="model-icon">✦</div>
                        <div class="model-text">
                            <strong id="modelName">Astra AI</strong>
                            <small id="modelDesc">Intelligent assistant</small>
                        </div>
                        <span class="model-caret">▾</span>
                    </button>
                    <div class="model-menu" id="modelMenu">
                        <button class="model-option selected" data-name="Astra AI" data-desc="Intelligent assistant" onclick="selectModel(this)">Astra AI <span>✓</span></button>
                        <button class="model-option" data-name="GPT-4o" data-desc="OpenAI model" onclick="selectModel(this)">GPT-4o</button>
                        <button class="model-option" data-name="Claude 3.5" data-desc="Anthropic model" onclick="selectModel(this)">Claude 3.5</button>
                    </div>
                </div>
            </div>

            <div class="status">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">Ready to assist</span>
            </div>
        </header>

        <section class="chat" id="chat">
            <div class="chat-inner">

                <div class="welcome" id="welcome">
                    <div class="welcome-orb">✦</div>
                    <h1>How can I help you today?</h1>
                    <p>Your intelligent workspace for everyday tasks, ideas, and learning.</p>

                    <div class="suggestions">
                        <button class="suggestion" onclick="useSuggestion('Write a professional email asking for leave.')">
                            <b>✉ Write an email</b>
                            Create a clear and professional message.
                        </button>

                        <button class="suggestion" onclick="useSuggestion('Explain Excel to me in simple English.')">
                            <b>▤ Learn something</b>
                            Understand a topic step by step.
                        </button>

                        <button class="suggestion" onclick="useSuggestion('Help me plan my day efficiently.')">
                            <b>◷ Plan my day</b>
                            Organize your tasks and priorities.
                        </button>

                        <button class="suggestion" onclick="useSuggestion('Improve this sentence and make it professional: ')">
                            <b>✎ Improve writing</b>
                            Make your writing clearer and better.
                        </button>

                        <button class="suggestion" onclick="useSuggestion('Analyze this image and summarize the key points.')">
                            <b>◱ Analyze an image</b>
                            Attach a file and get a quick summary.
                        </button>

                        <button class="suggestion" onclick="useSuggestion('Generate three ideas for a new business project.')">
                            <b>✦ Brainstorm ideas</b>
                            Explore directions for a new project.
                        </button>
                    </div>
                </div>

            </div>
        </section>

        <div class="composer-wrap">
            <div class="composer">
                <div class="attachments-preview" id="attachPreview"></div>

                <div class="input-row">
                    <textarea id="message" rows="1" placeholder="Message Astra..." aria-label="Message Astra" onkeydown="handleKey(event)"></textarea>
                    <button class="send" id="sendBtn" aria-label="Send message" onclick="sendMessage()">↑</button>
                </div>

                <div class="composer-footer">
                    <div class="composer-tools">
                        <button aria-label="Attach a file" onclick="document.getElementById('fileInput').click()">＋ Attach</button>
                        <button aria-label="Voice input (coming soon)" onclick="voicePlaceholder()">◉ Voice</button>
                        <button id="aiAssistBtn" aria-label="Toggle AI assistance" class="on" onclick="toggleAssist(this)">✦ AI assistance</button>
                    </div>
                    <span class="footer-hint">Enter to send · Shift + Enter for new line</span>
                </div>

                <input type="file" id="fileInput" multiple accept=".txt,.md,.json,.jpg,.jpeg,.png,.gif,.webp" style="display:none" onchange="handleFiles(event)">
            </div>
        </div>

    </main>
</div>

<button class="fab" aria-label="New conversation" onclick="newChat()">＋</button>

<script>
/* ---------- State ---------- */
const input = document.getElementById("message");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const sendBtn = document.getElementById("sendBtn");
const attachPreview = document.getElementById("attachPreview");
const historyListEl = document.getElementById("historyList");

let conversations = [];
let currentId = null;
let pendingFiles = [];
let assistOn = true;
let lastUserMessage = null;

/* ---------- Sidebar (mobile) ---------- */
function openSidebar() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("sidebarOverlay").classList.add("show");
}
function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("show");
}

/* ---------- Model selector ---------- */
function toggleModelMenu() {
    const menu = document.getElementById("modelMenu");
    const open = menu.classList.toggle("open");
    document.getElementById("modelBtn").setAttribute("aria-expanded", open);
}
function selectModel(btn) {
    document.querySelectorAll(".model-option").forEach(o => { o.classList.remove("selected"); o.innerHTML = o.dataset.name; });
    btn.classList.add("selected");
    btn.innerHTML = btn.dataset.name + ' <span>✓</span>';
    document.getElementById("modelName").textContent = btn.dataset.name;
    document.getElementById("modelDesc").textContent = btn.dataset.desc;
    document.getElementById("modelMenu").classList.remove("open");
}
document.addEventListener("click", (e) => {
    if (!e.target.closest(".model-select-wrap")) document.getElementById("modelMenu").classList.remove("open");
});

/* ---------- Composer tools ---------- */
function toggleAssist(btn) {
    assistOn = !assistOn;
    btn.classList.toggle("on", assistOn);
}
function voicePlaceholder() {
    setStatus("Voice input is coming soon", false);
    setTimeout(() => setStatus("Ready to assist", true), 1800);
}
function setStatus(text, ready) {
    document.getElementById("statusText").textContent = text;
    document.getElementById("statusDot").classList.toggle("thinking", !ready);
}

/* ---------- Suggestions / input resize ---------- */
function useSuggestion(text) {
    input.value = text;
    input.focus();
    autoResize();
}
input.addEventListener("input", autoResize);
function autoResize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 130) + "px";
}
function handleKey(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
}

/* ---------- File uploads ---------- */
function handleFiles(event) {
    const files = Array.from(event.target.files);
    files.forEach(file => {
        const isImage = file.type.startsWith("image/");
        const item = { id: crypto.randomUUID(), file, isImage, progress: 0, dataUrl: null };
        pendingFiles.push(item);
        if (isImage) {
            const reader = new FileReader();
            reader.onload = e => {
                item.dataUrl = e.target.result;
                renderAttachments();
                simulateUploadProgress(item);
            };
            reader.readAsDataURL(file);
        }
    });
    renderAttachments();
    event.target.value = "";
}

function simulateUploadProgress(item) {
    let p = 0;
    const t = setInterval(() => {
        p += 20;
        item.progress = Math.min(p, 100);
        renderAttachments();
        if (p >= 100) clearInterval(t);
    }, 90);
}

function removeAttachment(id) {
    pendingFiles = pendingFiles.filter(f => f.id !== id);
    renderAttachments();
}

function fileIcon(file) {
    if (file.name.endsWith(".json")) return "{ }";
    if (file.name.endsWith(".md")) return "M↓";
    return "▤";
}

function renderAttachments() {
    attachPreview.innerHTML = "";
    pendingFiles.forEach(item => {
        const chip = document.createElement("div");
        chip.className = "attachment-chip";

        if (item.isImage) {
            if (item.progress < 100 && item.dataUrl) {
                const p = document.createElement("div");
                p.className = "chip-progress";
                p.style.setProperty("--p", item.progress + "%");
                chip.appendChild(p);
            } else if (item.dataUrl) {
                const img = document.createElement("img");
                img.src = item.dataUrl;
                chip.appendChild(img);
            } else {
                const ico = document.createElement("div");
                ico.className = "file-icon";
                ico.textContent = "◱";
                chip.appendChild(ico);
            }
        } else {
            const ico = document.createElement("div");
            ico.className = "file-icon";
            ico.textContent = fileIcon(item.file);
            chip.appendChild(ico);
        }

        const name = document.createElement("span");
        name.className = "chip-name";
        name.textContent = item.file.name;
        chip.appendChild(name);

        const remove = document.createElement("button");
        remove.className = "chip-remove";
        remove.setAttribute("aria-label", "Remove attachment");
        remove.textContent = "✕";
        remove.onclick = () => removeAttachment(item.id);
        chip.appendChild(remove);

        attachPreview.appendChild(chip);
    });
}

/* ---------- Markdown (lightweight) ---------- */
function renderMarkdown(text) {
    let escaped = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

    escaped = escaped.replace(/```([\s\S]*?)```/g, (m, code) => `<pre><code>${code.trim()}</code></pre>`);
    escaped = escaped.replace(/`([^`]+)`/g, "<code>$1</code>");
    escaped = escaped.replace(/^### (.*)$/gm, "<h3>$1</h3>");
    escaped = escaped.replace(/^## (.*)$/gm, "<h2>$1</h2>");
    escaped = escaped.replace(/^# (.*)$/gm, "<h1>$1</h1>");
    escaped = escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    escaped = escaped.replace(/\*(.+?)\*/g, "<em>$1</em>");

    const lines = escaped.split("\n");
    let html = "";
    let inList = false;
    let paragraph = [];

    function flushParagraph() {
        if (paragraph.length) {
            html += "<p>" + paragraph.join(" ") + "</p>";
            paragraph = [];
        }
    }

    lines.forEach(line => {
        const trimmed = line.trim();
        if (/^[-*] /.test(trimmed)) {
            flushParagraph();
            if (!inList) { html += "<ul>"; inList = true; }
            html += "<li>" + trimmed.replace(/^[-*] /, "") + "</li>";
        } else if (/^\d+\. /.test(trimmed)) {
            flushParagraph();
            if (!inList) { html += "<ol>"; inList = true; }
            html += "<li>" + trimmed.replace(/^\d+\. /, "") + "</li>";
        } else {
            if (inList) { html += inList === "ol" ? "</ol>" : "</ul>"; inList = false; }
            if (trimmed === "") { flushParagraph(); }
            else if (/^<h[1-3]>|^<pre>/.test(trimmed)) { flushParagraph(); html += trimmed; }
            else paragraph.push(trimmed);
        }
    });
    flushParagraph();
    if (inList) html += "</ul>";
    return html;
}

/* ---------- History ---------- */
function timeAgo(ts) {
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) return "just now";
    if (diff < 3600) return Math.floor(diff / 60) + "m ago";
    if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
    return Math.floor(diff / 86400) + "d ago";
}

function renderHistory() {
    historyListEl.innerHTML = "";
    if (conversations.length === 0) {
        historyListEl.innerHTML = '<div class="empty-note">Your conversations will appear here.</div>';
        return;
    }
    conversations.slice().reverse().forEach(conv => {
        const row = document.createElement("div");
        row.className = "history-item" + (conv.id === currentId ? " active" : "");

        const btn = document.createElement("button");
        btn.className = "hist-btn";
        btn.onclick = () => loadConversation(conv.id);
        btn.innerHTML = `<span class="hist-title">${conv.title}</span><span class="hist-time">${timeAgo(conv.updated)}</span>`;

        const del = document.createElement("button");
        del.className = "hist-delete";
        del.setAttribute("aria-label", "Delete conversation");
        del.textContent = "✕";
        del.onclick = (e) => { e.stopPropagation(); deleteConversation(conv.id); };

        row.appendChild(btn);
        row.appendChild(del);
        historyListEl.appendChild(row);
    });
}

function ensureConversation() {
    if (currentId) return conversations.find(c => c.id === currentId);
    const conv = { id: crypto.randomUUID(), title: "New conversation", messages: [], updated: Date.now() };
    conversations.push(conv);
    currentId = conv.id;
    renderHistory();
    return conv;
}

function loadConversation(id) {
    currentId = id;
    const conv = conversations.find(c => c.id === id);
    chat.querySelector(".chat-inner").innerHTML = "";
    if (!conv || conv.messages.length === 0) {
        chat.querySelector(".chat-inner").appendChild(welcome);
        welcome.style.display = "";
    } else {
        conv.messages.forEach(m => renderMessage(m.text, m.type, m.attachments || []));
    }
    renderHistory();
    closeSidebar();
}

function deleteConversation(id) {
    conversations = conversations.filter(c => c.id !== id);
    if (id === currentId) {
        currentId = null;
        newChat();
    } else {
        renderHistory();
    }
}

function newChat() {
    currentId = null;
    pendingFiles = [];
    renderAttachments();
    chat.querySelector(".chat-inner").innerHTML = "";
    chat.querySelector(".chat-inner").appendChild(welcome);
    welcome.style.display = "";
    input.value = "";
    autoResize();
    renderHistory();
    closeSidebar();
}

/* ---------- Messaging ---------- */
function renderMessage(text, type, attachments = []) {
    if (welcome && welcome.style.display !== "none") welcome.style.display = "none";

    const wrapper = document.createElement("div");
    wrapper.className = "message " + type;

    const avatar = document.createElement("div");
    avatar.className = "message-avatar " + (type === "user" ? "user-avatar" : "ai-avatar");
    avatar.textContent = type === "user" ? "K" : "✦";

    const body = document.createElement("div");
    body.className = "message-body";

    const name = document.createElement("div");
    name.className = "message-name";
    name.textContent = type === "user" ? "You" : "Astra AI";

    const messageText = document.createElement("div");
    messageText.className = "message-text";
    messageText.innerHTML = type === "ai" ? renderMarkdown(text) : text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

    body.appendChild(name);
    body.appendChild(messageText);

    if (attachments.length) {
        const wrap = document.createElement("div");
        wrap.className = "msg-attachments";
        attachments.forEach(a => {
            const chip = document.createElement("div");
            chip.className = "msg-attachment";
            if (a.dataUrl) {
                const img = document.createElement("img");
                img.src = a.dataUrl;
                chip.appendChild(img);
            }
            const label = document.createElement("span");
            label.textContent = a.name;
            chip.appendChild(label);
            wrap.appendChild(chip);
        });
        body.appendChild(wrap);
    }

    if (type === "ai") {
        const actions = document.createElement("div");
        actions.className = "message-actions";
        const copyBtn = document.createElement("button");
        copyBtn.textContent = "Copy";
        copyBtn.onclick = () => copyText(copyBtn);
        const regenBtn = document.createElement("button");
        regenBtn.textContent = "↻ Regenerate";
        regenBtn.onclick = () => regenerate();
        actions.appendChild(copyBtn);
        actions.appendChild(regenBtn);
        body.appendChild(actions);
    }

    wrapper.appendChild(avatar);
    wrapper.appendChild(body);

    chat.querySelector(".chat-inner").appendChild(wrapper);
    chat.scrollTop = chat.scrollHeight;
    return wrapper;
}

function addMessage(text, type, attachments = []) {
    const conv = ensureConversation();
    conv.messages.push({ text, type, attachments, ts: Date.now() });
    conv.updated = Date.now();
    if (type === "user" && conv.title === "New conversation") {
        conv.title = text.slice(0, 42) + (text.length > 42 ? "…" : "");
    }
    renderHistory();
    return renderMessage(text, type, attachments);
}

async function sendMessage() {
    const message = input.value.trim();
    if ((!message && pendingFiles.length === 0) || sendBtn.disabled) return;

    const attachments = pendingFiles.map(f => ({ name: f.file.name, dataUrl: f.dataUrl || null }));
    const displayText = message || "(sent attachment" + (attachments.length > 1 ? "s)" : ")");
    addMessage(displayText, "user", attachments);
    lastUserMessage = { message, attachments };

    input.value = "";
    pendingFiles = [];
    renderAttachments();
    autoResize();
    await requestReply(message, attachments);
}

async function regenerate() {
    if (!lastUserMessage || sendBtn.disabled) return;
    await requestReply(lastUserMessage.message, lastUserMessage.attachments);
}

async function requestReply(message, attachments) {
    sendBtn.disabled = true;
    sendBtn.textContent = "…";
    setStatus("Thinking…", false);

    const thinking = document.createElement("div");
    thinking.className = "message ai";
    thinking.id = "thinking";
    thinking.innerHTML = `
        <div class="message-avatar ai-avatar pulsing">✦</div>
        <div class="message-body">
            <div class="message-name">Astra AI</div>
            <div class="message-text">Thinking...</div>
        </div>`;
    chat.querySelector(".chat-inner").appendChild(thinking);
    chat.scrollTop = chat.scrollHeight;

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                message: message,
                attachments: attachments.map(a => a.name),
                assist: assistOn
            })
        });

        const data = await response.json();
        thinking.remove();

        if (data.error) {
            addMessage("Error: " + data.error, "ai");
        } else {
            addMessage(data.reply, "ai");
        }
    } catch (error) {
        thinking.remove();
        let note = "";
        if (attachments.length) {
            note = attachments.length === 1
                ? `I can see you attached **${attachments[0].name}** — once connected to a backend, I'll analyze it directly.`
                : `I can see you attached ${attachments.length} files — once connected to a backend, I'll analyze them directly.`;
        }
        addMessage(
            "I couldn't reach the Astra backend, so this is a placeholder reply.\n\n" +
            (note ? note + "\n\n" : "") +
            "Here's what I received:\n\n> " + (message || "*(no text, just attachments)*"),
            "ai"
        );
    }

    sendBtn.disabled = false;
    sendBtn.textContent = "↑";
    setStatus("Ready to assist", true);
    input.focus();
}

function copyText(button) {
    const text = button.closest(".message-body").querySelector(".message-text").innerText;
    navigator.clipboard.writeText(text);
    button.textContent = "Copied!";
    setTimeout(() => button.textContent = "Copy", 1200);
}

/* ---------- Particle background ---------- */
(function particles() {
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    let w, h, dots = [];
    let mouse = { x: null, y: null };

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    const count = window.innerWidth < 768 ? 14 : 26;
    for (let i = 0; i < count; i++) {
        dots.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 1.6 + 0.6,
            vx: (Math.random() - 0.5) * 0.15,
            vy: (Math.random() - 0.5) * 0.15
        });
    }

    window.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });

    function tick() {
        ctx.clearRect(0, 0, w, h);
        dots.forEach(d => {
            d.x += d.vx;
            d.y += d.vy;
            if (d.x < 0 || d.x > w) d.vx *= -1;
            if (d.y < 0 || d.y > h) d.vy *= -1;

            if (mouse.x !== null) {
                const dx = mouse.x - d.x, dy = mouse.y - d.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 140) {
                    d.x -= dx / dist * 0.4;
                    d.y -= dy / dist * 0.4;
                }
            }

            ctx.beginPath();
            ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(139,92,246,0.35)";
            ctx.fill();
        });
        requestAnimationFrame(tick);
    }
    tick();
})();

/* ---------- Init ---------- */
renderHistory();
</script>

</body>
</html>
